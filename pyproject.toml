[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "expertpa"
version = "0.1.0"
description = "Network monitoring and remote control server for SPE Expert PA amplifiers"
readme = "Anforderungen.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "websockets>=12.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
